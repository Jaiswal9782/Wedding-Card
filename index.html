<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { revealed: false, ev: -1, fam: 'darshan', now: Date.now(), musicOn: false };
  }
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ now: Date.now() }), 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  /* ---------- background song: Aaj Sajeya ---------- */
  playMusic() {
    if (!this.audio) { this.audio = new Audio('music/aaj-sajeya.mp3'); this.audio.loop = true; this.audio.volume = 0.85; }
    const p = this.audio.play(); if (p && p.catch) p.catch(() => {});
    if (!this.state.musicOn) this.setState({ musicOn: true });
  }
  pauseSong() {
    if (this.audio) this.audio.pause();
    if (this.state.musicOn) this.setState({ musicOn: false });
  }
  renderVals() {
    const map = (q) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
    const home = { venue: 'निजी आवास', addr: 'चन्द्रवरदाई नगर, अजमेर (राज.)', map: 'https://maps.app.goo.gl/mRPSBFGfPWd5tRVt9' };
    const sai = { venue: 'साँईबाबा समारोह स्थल', addr: 'नेहरू नगर, अजय नगर, अजमेर (राज.)', map: 'https://maps.app.goo.gl/RvrmvrGNf6ztwX9KA' };
    const sadri = { venue: 'हिन्दू धर्मशाला (पिछला भाग)', addr: 'छोटी सादड़ी, जिला – प्रतापगढ़ (राज.)', map: 'https://maps.app.goo.gl/S5yhPzRwmTqPFAEU6' };
    const D19 = 'गुरुवार, 19 नवम्बर 2026', D23 = 'सोमवार, 23 नवम्बर 2026', D24 = 'मंगलवार, 24 नवम्बर 2026', D25 = 'बुधवार, 25 नवम्बर 2026', D26 = 'गुरुवार, 26 नवम्बर 2026';
    const raw = [
      { name: 'श्री गणेश स्थापना', short: 'गुरु, 19 नव.', date: D19, time: 'प्रातः 7:15 बजे', ...home },
      { name: 'माताजी पूजन', short: 'गुरु, 19 नव.', date: D19, time: 'प्रातः 9:15 बजे', ...home },
      { name: 'हल्दी, मेहन्दी', short: 'सोम, 23 नव.', date: D23, time: 'सायं 4:15 बजे', ...home },
      { name: 'महिला संगीत', short: 'सोम, 23 नव.', date: D23, time: 'सायं 6:15 बजे', ...home },
      { name: 'बड़ा विनायक, मंगल कलश', short: 'मंगल, 24 नव.', date: D24, time: 'प्रातः 7:15 व 8:15 बजे', ...sai },
      { name: 'मन्त्री पूजा, मायरा', short: 'मंगल, 24 नव.', date: D24, time: 'प्रातः 9:15 बजे', ...sai },
      { name: 'बिन्दौली, वर निकासी', short: 'मंगल, 24 नव.', date: D24, time: 'सायं 7:15 बजे', ...sai },
      { name: 'बारात प्रस्थान', short: 'मंगल, 24 नव.', date: D24, time: 'रात्रि 9:15 बजे (बस द्वारा)', venue: 'छोटी सादड़ी हेतु', addr: 'ब्याईजी सा. श्री नागेशजी, महेशजी, दिनेशजी जायसवाल के यहाँ', map: map('Chhoti Sadri, Pratapgarh, Rajasthan'), note: '' },
      { name: 'ओढ़नी / तिलक', short: 'बुध, 25 नव.', date: D25, time: 'प्रातः 10:15 बजे', ...sadri },
      { name: 'शुभ लग्न', short: 'बुध, 25 नव.', date: D25, time: 'रात्रि 11:00 बजे', ...sadri },
      { name: 'आशीर्वाद समारोह एवं स्वरुचिभोज', short: 'गुरु, 26 नव.', date: D26, time: 'ढलती शाम से सुहानी रात तक', ...sai }
    ];
    const n = raw.length;
    const ev = this.state.ev;
    const pad2 = (x) => String(x).padStart(2, '0');
    const c = ev >= 0 ? raw[ev] : raw[0];
    const cur = { ...c, note: c.note || '', idx: pad2(ev + 1) + ' / ' + pad2(n) };
    const btn = (on) => 'width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #FFFBF5; cursor: ' + (on ? 'pointer' : 'default') + '; border: 1.5px solid ' + (on ? '#8C2F45' : '#E0CBA2') + '; color: ' + (on ? '#8C2F45' : '#C9B79A') + ';';
    const prevOn = ev >= 0, nextOn = ev < n - 1;

    const venues = [
      { kicker: 'The Venue · निवास', name: home.venue, addr: home.addr, when: '19 एवं 23 नवम्बर 2026 के सभी कार्यक्रम', map: home.map },
      { kicker: 'The Venue · समारोह', name: sai.venue, addr: sai.addr, when: '24 एवं 26 नवम्बर 2026 के सभी कार्यक्रम', map: sai.map },
      { kicker: 'The Venue · विवाह', name: sadri.venue, addr: sadri.addr, when: 'बुधवार, 25 नवम्बर 2026 · ओढ़नी/तिलक एवं शुभ लग्न', map: sadri.map }
    ];

    const famRaw = [
      { id: 'darshan', title: 'दर्शनाभिलाषी', text: 'श्री रमेशचन्द्रजी-चन्द्रकान्ता, \nअशोकजी-शकुन्तला बाई, \nराजेन्द्रजी-सुशीला बाई, \nस्व. श्री गजेन्द्रजी-विजयलक्ष्मी, \nदेवेन्द्रजी-राधा बाई, \nमनीषजी-मधु बाई, \nविकासजी-ममता बाई, \nलोकेश-चन्द्रकान्ता, \nपिन्टू-गायत्री, \nइन्द्रजीत-सन्तोष, \nदीपक-मिथलेश, \nहेमन्त-अंतिमा, \nचन्द्रशेखर-अनुराधा, \nयोगेश-रेखा, कपिल जी, प्रिंस जी एवं समस्त मेलीवाल परिवार।' },
      { id: 'aagrah', title: 'विशेष आग्रह', text: 'राजेन्द्रजी-सुशीला, इन्द्रजीतजी-सन्तोष, मनीषजी-मधुबाला, भारती-दिनेशजी, जितेन्द्र-निशा, योगेश-रेखा, गौरव, सौरभ, कपिल, प्रिन्स, युगलकिशोर-सीमा, देवांश, हेमाक्षी' },
      { id: 'nanihal', title: 'ननिहाल पक्ष', text: 'स्व. श्री दौलतरामजी-स्व. श्रीमती मेहताब देवी, स्व. श्री मदनलालजी-स्व. श्रीमती प्रेम देवी, स्व. श्री केसरीमलजी-श्रीमती चन्दा देवी, स्व. श्री राजेन्द्रजी-स्व. श्रीमती सुशीला देवी, श्री महेन्द्रजी-श्रीमती रुजन देवी, स्व. श्री सुरेन्द्रजी-श्रीमती दक्षा देवी, स्व. श्री प्रकाशजी-श्रीमती इन्द्रा देवी, श्री राकेशजी-श्रीमती शोभा देवी, श्री गगनजी, श्री यशराजजी एवं समस्त जायसवाल परिवार (अजमेर)' },
      { id: 'swagat', title: 'स्वागतातुर', text: 'श्रीमती देवकन्या बेबी-स्व. श्री रामकिशनजी, श्रीमती शोभा-डॉ. स्व. श्री प्रेमचन्दजी, श्रीमती उमा-स्व. श्री जगदीशजी, श्रीमती सुनीता-श्री अरुणजी, डॉ. आरती, श्रीमती साची-श्री अतुलजी, पंकजजी, सुनीलजी, डॉ. दीपेन्द्रसिंहजी, रणजीतजी, वैभवजी, मधुबाला-मनीषजी, भारती-दिनेशजी, लवीना-जिगरजी, गौरवजी, सौरभजी, कपिल जी, प्रिंस जी' }
    ];
    const fams = famRaw.map((f) => {
      const open = f.id === this.state.fam;
      const names = [];
      f.text.replace(/।\s*$/, '').split(/\s*[,\n]\s*/).forEach((part) => {
        part.split(/\s+एवं\s+/).forEach((p, k) => { const t = p.trim(); if (t) names.push(k > 0 ? 'एवं ' + t : t); });
      });
      return { title: f.title, text: f.text, names: names.map((x) => ({ text: x, dot: /^एवं /.test(x) ? 'visibility: hidden;' : '' })), open: open,
        chev: 'transition: transform .2s; transform: rotate(' + (open ? '180' : '0') + 'deg)',
        toggle: () => this.setState({ fam: open ? '' : f.id }) };
    });

    const target = new Date('2026-11-25T23:00:00+05:30').getTime();
    const diff = Math.max(0, target - (this.state.now || Date.now()));
    const cd = { d: String(Math.floor(diff / 86400000)), h: pad2(Math.floor(diff / 3600000) % 24), m: pad2(Math.floor(diff / 60000) % 60), s: pad2(Math.floor(diff / 1000) % 60) };

    return {
      startSong: () => this.playMusic(),
      musicOn: !!this.state.musicOn, musicOff: !this.state.musicOn,
      musicLabel: this.state.musicOn ? 'गाना बंद करें' : 'गाना चालू करें',
      toggleMusic: () => { if (this.state.musicOn) this.pauseSong(); else this.playMusic(); },
      revealed: this.state.revealed, notRevealed: !this.state.revealed,
      reveal: () => this.setState({ revealed: true }),
      events: raw, onCover: ev < 0, onEvent: ev >= 0, cur,
      openBook: () => this.setState({ ev: 0 }),
      prev: () => { if (prevOn) this.setState({ ev: ev - 1 }); },
      next: () => { if (nextOn) this.setState({ ev: ev + 1 }); },
      prevDisabled: !prevOn, nextDisabled: !nextOn,
      prevStyle: btn(prevOn), nextStyle: btn(nextOn),
      venues, fams, cd
    };
  }
}

window.Component = Component;

</script>
